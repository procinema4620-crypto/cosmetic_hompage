# 개발용 MySQL — `docker compose up -d` 로 실행, `docker compose down` 으로 중지(데이터는 볼륨에 유지)
services:
  db:
    image: mysql:8.4
    container_name: maisonverde-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root-dev-password
      MYSQL_DATABASE: maisonverde
      MYSQL_USER: mv_app
      MYSQL_PASSWORD: mv-dev-password
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306" # 내 PC에서만 접속 가능
    volumes:
      - mv-db-data:/var/lib/mysql
volumes:
  mv-db-data:
